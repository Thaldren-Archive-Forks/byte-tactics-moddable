name: Sync main with upstream

# main mirrors HectorBailey/byte-tactics and takes nothing else. The
# "main mirrors upstream" ruleset lets only the repository admin push to it,
# so the sync runs as the admin through SYNC_TOKEN: a fine-grained token for
# this repository with Contents and Workflows read and write. The built-in
# token can't push upstream's workflow changes, and can't bypass the ruleset.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main to upstream main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SYNC_TOKEN is not set (see the comment at the top of this workflow)"
            exit 1
          fi
          gh repo sync "$GITHUB_REPOSITORY" --branch main --source HectorBailey/byte-tactics
